<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET LEAK MEME</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Top meme text */
        .top-text {
            font-size: 45px;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
        }

        /* Large Container */
        .meme-area {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Border */
            border: 4px dashed #333;
            background-color: #111;
            padding: 20px;
        }

        /* plain grey box */
        .neet-box {
            width: 350px;
            height: 160px;
            background-color: #808080;
            border: 8px solid #404040;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.4); /* shadow */
        }

        .neet-box h1 {
            margin: 0;
            font-size: 60px;
            color: #ff0000;
            text-shadow: 2px 2px 0px #000;
        }

        .neet-box p {
            margin: 5px 0 0 0;
            font-size: 20px;
            color: #fff;
            background-color: #000;
            padding: 2px 10px;
        }
        .leak-drop {
            position: absolute;
            top: 190px;
            width: 45px;
            height: 45px;
            background-color: #00a2ff;
            border-radius: 0 50% 50% 50%;
            transform: rotate(45deg); 
            animation: aggressive-leak 1.5s infinite linear;
            opacity: 0;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .floor {
            position: absolute;
            bottom: 30px;
            width: 450px;
            height: 8px;
            background-color: #ff0000;
        }

        /* caption at the bottom */
        .bottom-caption {
            margin-top: 30px;
            font-size: 32px;
            color: #ffff00;
            text-shadow: 2px 2px 0px #000;
        }

        @keyframes aggressive-leak {
            0% {
                top: 170px;
                transform: scale(0.4) rotate(45deg);
                opacity: 0;
            }
            10% {
                top: 190px;
                transform: scale(1) rotate(45deg);
                opacity: 1;
            }
            75% {
                top: 420px;
                transform: scale(1, 1.3) rotate(45deg);
                opacity: 1;
            }
            85% {
                top: 430px;
                transform: scale(1.8, 0.3) rotate(45deg);
                opacity: 0;
            }
            100% {
                top: 430px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="top-text">NTA DECLARES RESULTS:*</div>

    <div class="meme-area">

        <div class="neet-box">
            <h1>NEET UG</h1>
            <p>CONFIDENTIAL PAPERS</p>
        </div>

        <div class="leak-drop"></div>

        <div class="floor"></div>
        
    </div>

    <div class="bottom-caption">"It's just a minor logistical glitch guys"</div>

</body>
</html>
