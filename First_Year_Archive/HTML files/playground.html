<!DOCTYPE html>
<html>

<head>

  <style>
    
    .box1 {
      width: 150px;
      height: 80px;
      background-color: rgba(255, 255, 0, 0.616);
      margin-bottom: 20px;
      transform: rotate(20deg) skewY(20deg) scaleY(1.5);
    }


    
    .box2 {
      width: 150px;
      height: 150px;
      background-color: rgba(0, 251, 255, 0.503);
      margin-bottom: 20px;
      transform: translate(50px, 100px);
    }

    
    .box3 {
      width: 100px;
      height: 100px;
      background-color: rgba(255, 0, 0, 0.508);
      transition: width 2s, height 2s, background-color 2s, transform 2s;
    }

    .box3:hover {
      width: 300px;
      height: 500px;
      background-color: rgba(255, 166, 0, 0.632);
      transform: rotate(180deg);
    }
  </style>

</head>

<body>

  <h1>practice</h1>

  <br>
  <hr>
  <br>
  

  <h2>1. box 1</h2>

  <br>
  <hr>
  <br>

  <div class="box1"></div>

  <br>
  <hr>
  <br>

  <h2>2. box 2</h2>

  <br>
  <hr>
  <br>

  <div class="box2"></div>

  <br>
  <hr>
  <br>

  <h2>3. box3</h2>

  <br>
  <hr>
  <br>

  <div class="box3"></div>

  <br>
  <hr>
  <br>

</body>
</html>
