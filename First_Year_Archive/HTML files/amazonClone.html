<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="amazonStyle.css">
</head>
<body>
    <div class="navbar">

        <div class="nav-logo border">
            <div class="logo">
                
            </div>
        </div>

        <div class="nav-location border">

            <div class="location-logo">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            
            <div class="location-adress">
                <div class="adress-line1">
                    <p>Deliver to</p>
                </div>

                <div class="adress-line2">
                    India
                </div>
            </div>

        </div>

        <div class="nav-search">
            <select class="search-select">
                <option>All</option>
            </select>
            <input placeholder="Search Amazon" class="search-input">
            <div class="search-logo">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <div class="navbar-language border">
            <div class="language-logo">
                <i class="fa-solid fa-square"></i>
            </div>

            <select class="language-select">
                <option>EN</option>
            </select>
        </div>

        <div class="navbar-details border">
            <div class="details-line1">
                Hello, user
            </div>

            <div class="details-line2">
                Accounts & Lists
            </div>
        </div>

        <div class="navbar-details border">
            <div class="details-line1">
                Returns
            </div>

            <div class="details-line2">
                & Order
            </div>
        </div>

        <div class="navbar-cart border">
            <div class="cart-logo">
                <i class="fa-solid fa-basket-shopping"></i>
            </div>

            <div class="cart-text">
                Cart
            </div>
        </div>
    </div>

    <div class="navbar-bottom">
        <div class="nav-left">
            <div class="nav-left-menu">
                <i class="fa-solid fa-grip-lines"></i>
                <p>All</p>
            </div>
            <div class="nav-left-logo">

            </div>
        </div>
        <div class="nav-center">
            <div>Black Friday</div>
            <div>Prime Videos</div>
            <div>Buy Again</div>
            <div>Customer Service</div>
            <div>Registry</div>
            <div>Gift Cards</div>
            <div>Sell</div>
        </div>
        <div class="nav-right">
            <p>Shop Black Friday Deals</p>
        </div>
    </div>
</body>
</html>
