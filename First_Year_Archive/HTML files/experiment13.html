<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Navigation Bar</title>
  <style>
    
    .navbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      border: 1px solid black;
      padding: 10px;
    }

    .navbar a {
      text-decoration: none;
      color: black;
      font-size: 16px;
      padding: 5px;
    }

    .navbar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Simple Flexbox Navigation</h1>

  <div class="navbar">
    <a>#Home</a>
    <a>#About</a>
    <a>#Blog</a>
    <a>#Contact</a>
  </div>
</body>
</html>
