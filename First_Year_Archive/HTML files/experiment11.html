<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Example</title>
  <style>
    .box {
      border: 2px solid black;
      padding: 10px;
      margin: 15px;
    }

    .small-box {
      border: 1px dashed gray;
      padding: 5px;
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1>CSS Box Model Demo</h1>

  <div class="box">
    <p>This is a box with padding and margin. It has a solid border.</p>
  </div>

  <div class="small-box">
    <p>This is a smaller box with dashed border and less spacing.</p>
  </div>
</body>
</html>
