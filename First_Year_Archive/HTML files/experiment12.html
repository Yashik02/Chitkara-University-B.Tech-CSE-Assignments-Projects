<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Units Demo</title>
  <style>
    body {
      font-size: 16px;
      
    }

    .px-box {
      width: 200px;
      padding: 10px;
      border: 1px solid black;
    }

    .em-box {
      width: 20em;
      padding: 1em;
      border: 1px solid black;
    }

    .rem-box {
      width: 25rem;
      padding: 1.5rem;
      border: 1px solid black;
    }

    .percent-box {
      width: 80%;
      padding: 2%;
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h1>CSS Units Example</h1>

  <div class="px-box">
    <p>This box uses <strong>px</strong> units.</p>
  </div>

  <div class="em-box">
    <p>This box uses <strong>em</strong> units.</p>
  </div>

  <div class="rem-box">
    <p>This box uses <strong>rem</strong> units.</p>
  </div>

  <div class="percent-box">
    <p>This box uses <strong>%</strong> units.</p>
  </div>
</body>
</html>
