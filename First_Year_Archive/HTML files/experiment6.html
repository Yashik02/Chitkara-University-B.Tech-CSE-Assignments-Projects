<!DOCTYPE html>
<html>
<head>
  <title>Product Listing Table</title>
</head>
<body>
  <h2 align="center">Product Listing</h2>
  <table border="2" cellspacing="10" cellpadding="8" align="center">
    <tr bgcolor="yellow">
      <th>Product Name</th>
      <th>Category</th>
      <th>Price</th>
      <th>Availability</th>
    </tr>
    <tr align="center">
      <td>Wireless Mouse</td>
      <td>Electronics</td>
      <td>₹599</td>
      <td>In Stock</td>
    </tr>
    <tr align="center">
      <td>Notebook</td>
      <td>Stationery</td>
      <td>₹99</td>
      <td>Out of Stock</td>
    </tr>
    <tr align="center">
      <td>Water Bottle</td>
      <td>Home & Kitchen</td>
      <td>₹249</td>
      <td>In Stock</td>
    </tr>
  </table>
</body>
</html>
