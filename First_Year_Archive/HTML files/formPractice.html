<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>sample form and elements</h4>
    <hr>
    <form action="/action.php">
        <h5>enter username and password</h5>
        <input type="text" placeholder="enter name: ">
        <br>
        <br>
        <input type="password" placeholder="enter a password:">

        <br>
        <hr>
        <br>

        <h5>radio buttons for single option selection</h5>
        <label for="101">
        <input type="radio" value="a" name="class1" id="101"> option a
        </label>
        <br>
        <label for="102">
        <input type="radio" value="b" name="class1" id="102"> option b
        </label>

        <br>
        <hr>
        <br>

        <h5>checkbox for multiple choice</h5>

        <label for="111">
            <input type="checkbox" value="1" name="class2"  id="111"> option 1
        </label>
        <label for="112">
            <input type="checkbox" value="2" name="class2" id="112"> option 2
        </label>

        <br>
        <hr>
        <br>

        <h5>textarea</h5>

        <textarea name="feedback" id="ab" placeholder="please leave your feedback:" row=5 ></textarea>
        
        <br>
        <hr>
        <br>

        <h5>dropdown or select for a selection menu</h5>
        <select>
            <option value="one">one</option>
            <option value="two">two</option>
            <option value="three">three</option>
            <option value="four">four</option>
        </select>

        <br>
        <hr>
        <br>

        <h5>submit button</h5>
        <input type="submit" value="submit">
        
    </form>
    
</body>
</html>
