<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Layout Example</title>

  <!-- Bootstrap CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

  <div class="container mt-4">
    <h1 class="text-center text-primary mb-4">Bootstrap Grid Layout</h1>

    <div class="row">
      <div class="col-md-4 p-3 bg-light border text-center">
        <h3>Column 1</h3>
        <p>This section uses Bootstrap grid and utility classes.</p>
      </div>

      <div class="col-md-4 p-3 bg-warning border text-center">
        <h3>Column 2</h3>
        <p>Bootstrap makes layouts responsive and easy to manage.</p>
      </div>

      <div class="col-md-4 p-3 bg-info border text-center">
        <h3>Column 3</h3>
        <p>Utility classes help in quick styling.</p>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-md-6 p-4 bg-secondary text-white text-center">
        Left Section (50%)
      </div>
      <div class="col-md-6 p-4 bg-dark text-white text-center">
        Right Section (50%)
      </div>
    </div>

  </div>

</body>
</html>
