<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loader</title>
    <style>
        .loader {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 15px solid gainsboro;
            border-top: 15px solid goldenrod;
            animation: loader 1.5s linear infinite;
        }

        @keyframes loader {
            
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Loader</h1>
    <div class="loader">

    </div>
</body>
</html>
