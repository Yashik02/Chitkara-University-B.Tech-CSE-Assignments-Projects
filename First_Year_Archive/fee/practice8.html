<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: wheat;
        }
        .container {
            height: 300px;
            width: 600px;
            border: 1px solid red;
            background-color: darkgreen;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            grid-template-columns: repeat(3, 1fr);
            row-gap: 10px;
            column-gap: 10px;
            grid-gap: 20px;
            justify-items: center;
            align-items: center;
        }
        .boxes {
            height: 50px;
            width: 100px;
            background-color: yellowgreen;
            border: 1px solid black;
            text-align: center;
            align-content: center;
            
        }
        .one{
            /* grid-column-start: 1;
            grid-column-end: 3; */
        }
        .two {
            /* grid-column: 3/4;
            grid-row: 1/3; */
        } 
    </style>
</head>
<body>
    <div class="container">
        <div class="boxes one">1</div>
        <div class="boxes two">2</div>
        <div class="boxes three">3</div>
        <div class="boxes four">4</div>
        <div class="boxes five">5</div>
    </div>
</body>
</html>
