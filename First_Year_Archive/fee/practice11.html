<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fonts</title>
    <!-- icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=all_inclusive" />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
      .heading {
        font-family: "Fondamento", cursive;
        font-weight: 700;
        font-style: normal;
        text-align: center;
        color: goldenrod;
      }
      .material-symbols-outlined {
        user-select: none; 
        -webkit-user-select: none;
        cursor: default;
      }
    </style>

  </head>
  <body>
    <h1 class="heading">Omniscient Reader's Viewpoint</h2>
    <span class="material-symbols-outlined">all_inclusive</span>
    <i class="fa-sharp fa-solid fa-delete-left"></i>
  </body>
</html>
