<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            height: 10rem;
            width: 10rem;
            background-color: yellow;
            border-radius: 5rem;
        }
        .face__eyes {
            height: 1rem;
            width: 1rem;
            display: inline-block;
            background-color: black;
            border-radius: 5rem;
            margin: 3rem 1.93rem;
        }
        .face__mouth {
            height: 2rem;
            width: 5rem;
            background-color: red;
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
            margin: 0rem 2.5rem;
        }
    </style>
</head>
<body>
    <div class="face">
        <div class="face__eyes"></div>
        <div class="face__eyes"></div>
        <div class="face__mouth"></div>
    </div>
</body>
</html>
