<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player</title>
    <link rel="icon" type="image/png" href="SpotifyCloneAssets/logo.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SpotifyClone.css">
    
</head>
<body>
    <div class="spotify-app">
        <div class="spotify-app__header">search bar</div>
        
        <div class="sidebar-left">
            <div class="sidebar-left__header">
                <div class="slh-left">
                    <p>Your Library</p>
                </div>
                <div class="slh-right">
                    <div class="slh-right-1">
                        <div class="slh-right-1-1">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                        <div class="slh-right-1-2">Create</div>
                    </div>
                    <div class="slh-right-2">
                        <i class="fa-solid fa-expand"></i>
                    </div>
                </div>
            </div>
            <div class="sidebar-left__tags">
                <div class="slt-1">Playlists</div>
                <div class="slt-2">Artists</div>
            </div>
            <div class="sidebar-left__search">
                <div class="sls-left">
                    <i class="fa-solid fa-magnifying-glass my-magnifying-glass"></i>
                </div>
                <div class="sls-right">
                    <div class="sls-right-1">Recents</div>
                    <div class="sls-right-2">
                        <i class="fa-solid fa-list my-list"></i>
                    </div>
                </div>
            </div>
            <div class="sidebar-left__folders"></div>
        </div>

        <div class="main-content">main</div>

        <div class="sidebar-right">posters</div>

        <div class="spotify-app__footer">music controls</div>
    </div>
</body>
</html>
