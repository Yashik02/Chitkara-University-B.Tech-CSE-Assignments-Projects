<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        div {
            height: 100px;
            width: 100px;
            background-color: yellow;
            animation: widthinc 2s ease-in infinite alternate;
        }
        p{
            color: red;
        }
        @keyframes widthinc {
            0% {
                width: 50px;
                background-color: red;
            }
            100% {
                width:  200px;
                background-color: aqua;
            }
        }
    </style>
</head>
<body>
    <div>
          
    </div>
</body>
</html>
