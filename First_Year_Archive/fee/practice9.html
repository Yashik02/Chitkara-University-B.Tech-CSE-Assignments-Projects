<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive grids</title>
    <style>
      .container {
        height: 600px;
        width: 1000px;
        display: grid;
        gap: 10px;
        grid-template-rows: repeat(12, 1fr);
        grid-template-columns: repeat(12, 1fr);
      }
      .box {
        height: auto;
        width: auto;
        background-color: pink;
      }

      .header {
        grid-column: 1/13;
      }
      .sidebar {
        grid-row: 2/12;
        grid-column: 1/4;
      }
      .navigation {
        grid-column: 4/10;
      }
      .ads {
        grid-column: 10/13;
        grid-row: 2/12;
      }
      .main {
        grid-row: 3/12;
        grid-column: 4/10;
      }
      .footer {
        grid-column: 1/13;
      }

      @media (max-width: 720px) {
        .container {
          width: 720px;
        }
        .header {
          grid-column: 1/13;
        }
        .sidebar {
          grid-row: 3/12;
          grid-column: 1/4;
        }
        .navigation {
          grid-column: 1/13;
          grid-row: 2/3;
        }
        .ads {
          grid-column: 1/4;
          grid-row: 12/13;
        }
        .main {
          grid-row: 3/12;
          grid-column: 4/13;
        }
        .footer {
          grid-column: 4/13;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box header">(1 Row, 12 Columns)</div>
      <div class="box sidebar">(10 Row, 3 Columns)</div>
      <div class="box navigation">(1 Row, 6 Columns)</div>
      <div class="box ads">(10 Row, 3 Columns)</div>
      <div class="box main">(9 Row, 6 Columns)</div>
      <div class="box footer">(1 Row, 12 Columns)</div>
    </div>
  </body>
</html>
